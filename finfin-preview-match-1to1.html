/* subtle extra live stars on top of the mock so it doesn't feel like a dead screenshot */
.stars{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.6}
.stars:before,.stars:after{
  content:"";position:absolute;left:31%;right:7%;top:0;height:43%;
  background-image:
    radial-gradient(circle,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle,#ffd99d 0 1px,transparent 1.5px),
    radial-gradient(circle,#fff 0 .7px,transparent 1.2px);
  background-size:109px 93px,157px 141px,71px 81px;
  animation:twinkle 4.3s ease-in-out infinite alternate;
}
.stars:after{
  transform:translate(19px,11px);
  opacity:.42;
  animation-delay:-1.8s;
}
@keyframes twinkle{from{opacity:.18}to{opacity:.7}}

.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 61% 48%,transparent 42%,rgba(0,0,0,.12) 74%,rgba(0,0,0,.35) 100%);
}
.hint{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:10;font-size:10px;letter-spacing:.24em;color:#e9decd;
  text-shadow:0 2px 8px #000;opacity:.92;
}
.hotspot{position:absolute;z-index:11;cursor:pointer;border:0;background:transparent}
.hotspot:hover{outline:1px solid rgba(236,193,120,.55);box-shadow:0 0 26px rgba(232,182,103,.26);background:rgba(255,255,255,.01)}
/* Approximate frame locations in the target composition */
.h1{left:28.2%;top:15.7%;width:13.4%;height:54.5%}
.h2{left:44.7%;top:27.0%;width:9.0%;height:39.0%}
.h3{left:56.3%;top:32.0%;width:7.5%;height:31.0%}
.h4{left:63.1%;top:30.0%;width:7.9%;height:34.0%}
.h5{right:1.3%;top:14.0%;width:12.0%;height:57.0%}

.modal{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;
  background:rgba(0,0,0,.78);backdrop-filter:blur(10px);padding:28px
}
.modal.open{display:grid}
.card{
  width:min(780px,92vw);padding:28px;border:1px solid rgba(224,180,108,.42);
  background:linear-gradient(145deg,#0e0a07,#070604);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.year{font-size:50px;color:#d8aa66;margin-bottom:7px}
.card h2{font-size:34px;font-weight:400;margin:0 0 12px}
.card p{font-family:system-ui,sans-serif;color:#c8bcad;line-height:1.8;margin:0}
.close{position:absolute;top:20px;right:24px;color:white;background:none;border:0;font-size:38px;cursor:pointer}
.note{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  z-index:12;padding:8px 12px;border:1px solid rgba(218,172,100,.25);
  background:rgba(0,0,0,.28);backdrop-filter:blur(8px);
  border-radius:999px;font:11px system-ui,sans-serif;letter-spacing:.08em;
  color:#d8cbb8;opacity:0;transition:.25s
}
body:hover .note{opacity:.86}
@media(max-width:900px){
  .visual{background-size:auto 100%;background-position:61% center}
  .hotspot{display:none}
  .hint{font-size:8px;white-space:nowrap}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="visual" id="visual"></div>
  <div class="stars"></div>
  <div class="vignette"></div>

  <button class="hotspot h1" data-year="2023" data-title="The Beginning"></button>
  <button class="hotspot h2" data-year="2023" data-title="Little Moments"></button>
  <button class="hotspot h3" data-year="2024" data-title="Growing Together"></button>
  <button class="hotspot h4" data-year="2024" data-title="Always Together"></button>
  <button class="hotspot h5" data-year="2025" data-title="And Always You"></button>

  <div class="note">visual prototype — mouse move / wheel / click a frame</div>
  <div class="hint">MOVE MOUSE • SCROLL TO PUSH CAMERA</div>
</div>

<div class="modal" id="modal">
  <button class="close" id="close">×</button>
  <div class="card">
    <div class="year" id="year">2023</div>
    <h2 id="title">The Beginning</h2>
    <p>พื้นที่นี้เอาไว้ใส่เรื่องราวของรูป วันที่ สถานที่ หรือข้อความของความทรงจำแต่ละช่วงได้</p>
  </div>
</div>

<script>
const visual = document.getElementById('visual');
let mx=0,my=0,zoom=1.025;

function update(){
  const tx = mx * -10;
  const ty = my * -6;
  visual.style.transform =
    `translate3d(${tx}px,${ty}px,0) scale(${zoom}) rotateX(${-my*.35}deg) rotateY(${mx*.45}deg)`;
}
window.addEventListener('mousemove',e=>{
  mx=(e.clientX/innerWidth-.5);
  my=(e.clientY/innerHeight-.5);
  update();
});
window.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom += e.deltaY>0 ? .012 : -.012;
  zoom=Math.max(1.01,Math.min(1.12,zoom));
  update();
},{passive:false});

const modal=document.getElementById('modal');
document.querySelectorAll('.hotspot').forEach(h=>h.addEventListener('click',()=>{
  document.getElementById('year').textContent=h.dataset.year;
  document.getElementById('title').textContent=h.dataset.title;
  modal.classList.add('open');
}));
function closeModal(){modal.classList.remove('open')}
document.getElementById('close').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
